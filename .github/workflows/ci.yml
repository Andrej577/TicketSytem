name: Ticket System CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare CI environment
        run: cp deploy/.env.example deploy/.env

      - name: Validate Compose configuration
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml config

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare CI environment
        run: cp deploy/.env.example deploy/.env

      - name: Build application images
        run: docker compose --env-file deploy/.env -f deploy/compose.yaml build

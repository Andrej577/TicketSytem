name: ticket-system

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-ticket_system}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
      - frontend

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DATABASE:-ticket_system};Username=${POSTGRES_USER:-ticket_system};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-TicketSystem.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-TicketSystem.Web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/.env}
      Realtime__BaseUrl: http://realtime:8080
      Realtime__InternalKey: ${REALTIME_INTERNAL_KEY:?Set REALTIME_INTERNAL_KEY in deploy/.env}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${API_PORT:-8081}:8080"
    networks:
      - backend
      - frontend

  realtime:
    build:
      context: ..
      dockerfile: deploy/realtime.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:8180}
      Jwt__Issuer: ${JWT_ISSUER:-TicketSystem.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-TicketSystem.Web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/.env}
      InternalRealtime__Key: ${REALTIME_INTERNAL_KEY:?Set REALTIME_INTERNAL_KEY in deploy/.env}
    ports:
      - "${REALTIME_PORT:-8082}:8080"
    networks:
      - backend
      - frontend

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      realtime:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
      Realtime__BaseUrl: http://realtime:8080
      DataProtection__KeysPath: /var/ticketsystem/data-protection
    volumes:
      - web-data-protection:/var/ticketsystem/data-protection
    ports:
      - "${WEB_PORT:-8180}:8080"
    networks:
      - frontend

volumes:
  postgres-data:
  web-data-protection:

networks:
  backend:
    internal: true
  frontend:

name: ticket-system

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-ticket_system}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DATABASE:-ticket_system};Username=${POSTGRES_USER:-ticket_system};Password=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${API_PORT:-8081}:8080"
    networks:
      - backend

  realtime:
    build:
      context: ..
      dockerfile: deploy/realtime.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:8180}
    ports:
      - "${REALTIME_PORT:-8082}:8080"
    networks:
      - backend
      - frontend

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${WEB_PORT:-8180}:8080"
    networks:
      - frontend

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  frontend:
